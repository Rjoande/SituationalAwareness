// Situational Awareness — science gate: which experiment opens which readout.
//
// In Science and Career modes the panel does not show a number you have not
// measured yet. EXT TEMP, PRESSURE, the live GRAVITY reading and WEATHER read
// "???" (or UNKNOWN, for the weather section) on a body until one result of
// the matching experiment has been CREDITED there — any situation, any biome:
// one thermometer reading anywhere on Duna is enough to know Duna's air.
//
// Credited, not merely run: KSP registers a science subject the moment an
// experiment is deployed, so a result that was then thrown away must not count.
//
// Fields:
//   field        extTemp | pressure | gravity | weather
//   experiment   EXPERIMENT_DEFINITION id
//
// Several nodes on the same field OR together: any one of them opens it. A
// pack that ships its own instruments can add a node with ModuleManager and
// SA needs no change. No node for a field = that field is never gated.
//
// Sandbox has no R&D, so nothing is gated there; the whole mechanism can also
// be switched off in Difficulty Settings -> Situational Awareness.

SA_SCIENCE_GATE
{
    field = extTemp
    experiment = temperatureScan
}

SA_SCIENCE_GATE
{
    field = pressure
    experiment = barometerScan
}

SA_SCIENCE_GATE
{
    field = gravity
    experiment = gravityScan
}

SA_SCIENCE_GATE
{
    field = weather
    experiment = atmosphereAnalysis
}

// Bluedog Design Bureau's orbital weather camera (only defined when BDB is
// installed; a node naming an experiment that does not exist is harmless).
SA_SCIENCE_GATE
{
    field = weather
    experiment = bd_weather
}
