// SA localization — Italian.
// Comments stay in English (project convention: code/cfg comments are
// English, player-facing values are localized) and mirror en-us.cfg exactly,
// key for key, so the two files stay easy to diff against each other.
Localization
{
	it-it
	{
		// Settings page (Difficulty -> Situational Awareness): section title.
		#LOC_SA_settings_title = Situational Awareness
		// Settings page: label of the "show mission elapsed time" checkbox (default off, redundant with stock UI).
		#LOC_SA_settings_showMet = Mostra tempo di missione trascorso
		// Settings page: tooltip of the checkbox above.
		#LOC_SA_settings_showMet_tip = Aggiunge una riga MET al pannello SA. Disattivato di default: la UI di gioco lo mostra già altrove.
		// Settings page: label of the MET stockalike-format checkbox (only meaningful when "show MET" is on).
		#LOC_SA_settings_metStockalike = Formato MET in stile stock
		// Settings page: tooltip of the checkbox above.
		#LOC_SA_settings_metStockalike_tip = "T+1a 23g 03:14:09" (lettere per anno/giorno, sotto HH:MM:SS coi due punti) invece del formato di default "T+1a 23g 03o 14m 09s". \nSi applica solo se anche "Mostra tempo di missione trascorso" è attivo.
		// Settings page: label of the "show solar time" checkbox (default off, adds a 3rd line to the Surface dial).
		#LOC_SA_settings_showSolarTime = Mostra l'ora solare sul quadrante
		// Settings page: tooltip of the checkbox above.
		#LOC_SA_settings_showSolarTime_tip = Aggiunge una riga con l'ora solare al quadrante di Superficie: ora solare vera alla tua longitudine esatta (non quantizzata per fuso come l'ora locale). \nClicca sul quadrante per passare all'equazione del tempo. Cambia anche il conto alla rovescia di alba/tramonto sulla tua posizione esatta.
		// Settings page: label of the "use fixed surface gravity" checkbox (default off = live sensed value).
		#LOC_SA_settings_fixedGravity = Usa gravità di superficie fissa
		// Settings page: tooltip of the checkbox above.
		#LOC_SA_settings_fixedGravity_tip = Disattivato (default): la riga gravità mostra il valore rilevato in tempo reale (come il sensore di gravità stock). \nAttivato: mostra invece il valore di riferimento fisso ASL del corpo.
		// Settings page: label of the "use body map color" checkbox for the orbit dial's planet disc (default off).
		#LOC_SA_settings_bodyMapColor = Usa il colore mappa del corpo per il quadrante orbita
		// Settings page: tooltip of the checkbox above.
		#LOC_SA_settings_bodyMapColor_tip = Disattivato (default): il disco del pianeta sul quadrante orbita usa un colore neutro. Attivato: usa il colore mappa/linea-orbita del corpo stesso, attenuato.
		// Settings page: label of the SA window/font scale slider (default 1.5 = +50%).
		#LOC_SA_settings_uiScale = Scala del pannello SA
		// Settings page: tooltip of the slider above.
		#LOC_SA_settings_uiScale_tip = Scala l'intero pannello SA (finestra e font insieme, proporzioni invariate), sopra l'impostazione UI Scale del gioco stesso.
		// Settings page: label of the suborbital-altitude-threshold slider (default 0.25 = a quarter of the body's radius).
		#LOC_SA_settings_surfaceAltThreshold = Soglia quota superficie/suborbitale
		// Settings page: tooltip of the slider above.
		#LOC_SA_settings_surfaceAltThreshold_tip = Una traiettoria suborbitale sotto questa frazione del raggio del corpo viene letta ancora come modalità Superficie, non Orbita. \nNon influisce su una vera orbita stabile a qualunque quota.

		// Header chip: panel mode badge, vessel on a normal solid/liquid surface.
		#LOC_SA_chip_surface = SUPERFICIE
		// Header chip: panel mode badge, vessel in orbit/sub-orbital/escaping.
		#LOC_SA_chip_orbit = ORBITA
		// Header chip: panel mode badge, vessel on a body tidally locked onto its star.
		#LOC_SA_chip_tidalLock = BLOCCO MAREALE

		// Data row label: universal time (game calendar, Kronometer-aware).
		#LOC_SA_row_ut = UT
		// Data row label: local time at the KSC's real coordinates. Kept
		// short ("KSC" not "KSC TIME") because the timezone is appended
		// once at runtime, e.g. "KSC (TZ-3)" (bug fix 2026-07-25).
		#LOC_SA_row_kscTime = KSC
		// Data row label: mission elapsed time (optional, settings-gated).
		#LOC_SA_row_met = MET
		// Data row label: vessel latitude/longitude. Click cycles decimal/DMS format.
		#LOC_SA_row_coordinates = COORDINATE
		// Data row label: current science biome.
		#LOC_SA_row_biome = BIOMA
		// Data row label: sun elevation/azimuth above the local horizon.
		#LOC_SA_row_sun = SOLE
		// Data row label: solar flux at the vessel's position.
		#LOC_SA_row_flux = FLUSSO
		// Data row label: ambient external temperature (never the reentry-heated value). Click cycles °C/K. Hidden in vacuum (M3 restyling): a constant 4K there carries no information, see row_hullTemp.
		#LOC_SA_row_temperature = TEMP EST
		// Data row label: thermal-mass-weighted average part temperature (M3 restyling) — always meaningful, unlike EXT TEMP which reads a fixed constant in a vacuum. Click cycles °C/K (same unit as EXT TEMP).
		#LOC_SA_row_hullTemp = TEMP SCAFO
		// Data row label: static atmospheric pressure. Click cycles kPa/atm (auto-switches to Pa under 1 kPa).
		#LOC_SA_row_pressure = PRESSIONE
		// Data row label: local gravity (live sensed value by default, or fixed ASL — settings toggle). Click cycles g/m per s squared.
		#LOC_SA_row_gravity = GRAVITÀ
		// Data row label: distance/direction to the nearest terminator (tidal lock only). Click cycles km/deg.
		#LOC_SA_row_terminator = TERMINATORE

		// Footer: label before the solar day duration, e.g. "SOLAR DAY 24h 06m".
		#LOC_SA_footer_solarDay = GIORNO SOLARE

		// Clock sub-line: "local time" label next to the big clock (surface mode).
		#LOC_SA_val_localTime = ORA LOCALE
		// Clock sub-line: "Sol N" day counter (surface mode, non-home bodies only).
		#LOC_SA_val_sol = Sol
		// Clock sub-line: day-progress percentage label (surface mode).
		#LOC_SA_val_dayProgress = giorno
		// Dial sub-label, 3rd line, surface mode, when SOLAR TIME is toggled on and in Clock format: "LAT" (Local Apparent Time, the standard gnomonics term — the time a sundial at this exact spot would show). Retest 2026-07-30: label now cycles with the value, was a fixed "SOLAR" for both formats.
		#LOC_SA_val_solarTimePrefix = LAT
		// Same dial line, when cycled to the equation-of-time format instead — "EoT", paired with LAT (retest 2026-07-30).
		#LOC_SA_val_eqtPrefix = EoT
		// Next-event label: countdown to sunrise (surface mode).
		#LOC_SA_val_sunrise = alba
		// Next-event label: countdown to sunset (surface mode).
		#LOC_SA_val_sunset = tramonto
		// Next-event label: countdown to eclipse entry (orbit mode).
		#LOC_SA_val_eclipse = ECLISSI
		// Next-event label: countdown to return to light (orbit mode).
		#LOC_SA_val_light = LUCE
		// Clock sub-line prefix, orbit mode: "NEXT ECLIPSE"/"NEXT LIGHT" (M3 restyling).
		#LOC_SA_val_next = PROSSIMA
		// Clock sub-line, orbit mode, replaces "NEXT ECLIPSE/LIGHT" when orbiting a star itself (no eclipse geometry applies, retest 2026-07-27).
		#LOC_SA_val_starCentric = ORBITA STELLARE
		// Clock sub-line, orbit mode, replaces "NEXT ECLIPSE/LIGHT" on an escape trajectory: the timer counts down to leaving the current SoI instead (retest 2026-07-27).
		#LOC_SA_val_soiChange = CAMBIO SOI
		// Clock sub-line, orbit mode: orbital period label, e.g. "Period 01:32:07" (M3 restyling).
		#LOC_SA_val_period = Periodo
		// Clock sub-line: sunlit fraction of the orbit (orbit mode).
		#LOC_SA_val_orbitLit = luce orbita
		// Lit-fraction value on a high orbit where the rounded percentage would misleadingly read "100%" despite a real (if brief-angle, possibly hours-long) eclipse existing (retest 2026-07-30).
		#LOC_SA_val_orbitLitNearFull = >99%
		// Strip tail prefix, orbit mode, lowercase on purpose (matches val_dayProgress's "day"): "light 71%" (M3 restyling).
		#LOC_SA_val_lightLower = luce
		// Big clock text when the body is tidally locked on its star (replaces the local-time readout).
		#LOC_SA_val_tidalLock = BLOCCO MAREALE
		// Clock sub-line: explains why there's no local-time readout (tidal lock mode, and the stellar dive exception below).
		#LOC_SA_val_noLocalTime = NESSUNA ORA LOCALE
		// Clock main, Surface mode, when the body IS the star itself (retest 2026-07-28): danger-red alert label, replaces the local-time clock.
		#LOC_SA_val_stellarDive = TUFFO STELLARE
		// Clock main, Surface mode, near a pole (M3 point 5, go 2026-07-28): neutral-color label, replaces the local-time clock — longitude is numerically unstable this close to the pole.
		#LOC_SA_val_polarZone = ZONA POLARE
		// Phase line under the dial, Surface mode, near a pole: with zero axial tilt the sun's elevation swing shrinks to almost nothing this close to the pole, so it never gets meaningfully dark.
		#LOC_SA_val_midnightSun = SOLE DI MEZZANOTTE
		// Clock sub-line: notes the sun's elevation is fixed (tidal lock mode).
		#LOC_SA_val_sunFixed = sole fisso
		// Clock sub-line, tidal lock mode: binary day/night indicator, replaces the 3-way phase name there (M3 restyling) — "day side".
		#LOC_SA_val_daySide = lato giorno
		// Clock sub-line, tidal lock mode: binary day/night indicator — "night side".
		#LOC_SA_val_nightSide = lato notte
		// Strip tail prefix, tidal lock mode: "TERM 412 km E" (M3 restyling).
		#LOC_SA_val_termShort = TERM
		// Timeline tick label, tidal-lock bar: subsolar end.
		#LOC_SA_val_subsolar = subsolare
		// Timeline tick label, tidal-lock bar: antisolar end.
		#LOC_SA_val_antisolar = antisolare
		// Pressure row value when static pressure is zero (design doc §1.1 — more Kerbal than "0.00 kPa").
		#LOC_SA_val_vacuum = VUOTO
		// Solar-day footer value when the body is tidally locked on its star (no finite day length).
		#LOC_SA_val_infinite = infinito
		// Duration-formatter unit-letter symbols (retest 2026-07-28/29), fallback only — normally sourced live from stock's own #autoLOC_600231x keys (same word regardless of Kronometer, which only changes how many seconds a unit is).
		#LOC_SA_unit_year = a
		#LOC_SA_unit_day = g
		#LOC_SA_unit_hour = o
		#LOC_SA_unit_minute = m
		#LOC_SA_unit_second = s
		// Footer badge for any body tidally locked (on its star or its parent planet).
		#LOC_SA_val_locked = BLOCCATO
		// Gravity row value when the live sensor has no reading (beyond 3 body radii, same range limit as the stock gravity sensor part).
		#LOC_SA_val_outOfRange = FUORI PORTATA

		// Surface day phase name: sun near the morning terminator (bodies WITH an atmosphere only — see terminatorSurface below for airless bodies).
		#LOC_SA_phase_dawn = Alba
		// Surface day phase name: between dawn and noon.
		#LOC_SA_phase_morning = Mattina
		// Surface day phase name: sun near its highest point in this timezone.
		#LOC_SA_phase_noon = Mezzogiorno
		// Surface day phase name: between noon and dusk.
		#LOC_SA_phase_afternoon = Pomeriggio
		// Surface day phase name: sun near the evening terminator (bodies WITH an atmosphere only).
		#LOC_SA_phase_dusk = Crepuscolo
		// Surface day phase name: sun below the horizon away from either terminator.
		#LOC_SA_phase_night = Notte
		// Surface day phase name: replaces Dawn/Dusk on bodies WITHOUT an atmosphere (no optical twilight to tell them apart).
		#LOC_SA_phase_terminatorSurface = Terminatore
		// Orbit phase name: vessel in direct sunlight.
		#LOC_SA_phase_sunlit = Illuminato
		// Orbit phase name: vessel in the body's shadow.
		#LOC_SA_phase_eclipse = Eclissi
		// Tidal-lock phase name: vessel on the permanent day side.
		#LOC_SA_phase_day = Giorno
		// Tidal-lock phase name: vessel near the static terminator band.
		#LOC_SA_phase_terminatorLock = Terminatore
		// Tidal-lock phase name: vessel on the permanent night side.
		#LOC_SA_phase_nightLock = Notte
	}
}
