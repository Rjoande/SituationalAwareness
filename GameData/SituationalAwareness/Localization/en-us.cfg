// SA localization master (English). Convention: every line carries a comment
// explaining where the string appears, to make translation possible without
// reading the code. M2: full telemetry-skin vocabulary (design doc §8),
// updated after the M2 test feedback (2026-07-19).
Localization
{
	en-us
	{
		// Settings page (Difficulty -> Situational Awareness): section title.
		#LOC_SA_settings_title = Situational Awareness
		// Settings page: label of the "show mission elapsed time" checkbox (default off, redundant with stock UI).
		#LOC_SA_settings_showMet = Show mission elapsed time
		// Settings page: tooltip of the checkbox above.
		#LOC_SA_settings_showMet_tip = Adds a MET row to the SA panel. Off by default: the stock UI already shows it elsewhere.
		// Settings page: label of the MET stockalike-format checkbox (only meaningful when "show MET" is on).
		#LOC_SA_settings_metStockalike = Stockalike MET format
		// Settings page: tooltip of the checkbox above.
		#LOC_SA_settings_metStockalike_tip = "T+1y 23d 03:14:09" (letters for year/day, colon HH:MM:SS below) instead of the default "T+1y 23d 03h 14m 09s". \nOnly applies when "Show mission elapsed time" is also on.
		// Settings page: label of the "show solar time" checkbox (default off, adds a 3rd line to the Surface dial).
		#LOC_SA_settings_showSolarTime = Show solar time on dial
		// Settings page: tooltip of the checkbox above.
		#LOC_SA_settings_showSolarTime_tip = Adds a SOLAR TIME line to the Surface dial: true solar time at your exact longitude (not zone-quantized like LOCAL TIME). \nClick the dial to cycle to the equation of time. Also switches the sunrise/sunset countdown to your exact position.
		// Settings page: label of the "use fixed surface gravity" checkbox (default off = live sensed value).
		#LOC_SA_settings_fixedGravity = Use fixed surface gravity
		// Settings page: tooltip of the checkbox above.
		#LOC_SA_settings_fixedGravity_tip = Off (default): gravity row shows the live sensed value (like the stock gravity sensor). On: shows the body's fixed ASL reference value instead.
		// Settings page: label of the "use body map color" checkbox for the orbit dial's planet disc (default off).
		#LOC_SA_settings_bodyMapColor = Use body map color for orbit dial
		// Settings page: tooltip of the checkbox above.
		#LOC_SA_settings_bodyMapColor_tip = Off (default): the orbit dial's planet disc uses a neutral color. On: uses the body's own map/orbit-line color, dimmed.
		// Settings page: label of the science-gate checkbox (default on). See ScienceGate.cfg for which experiment opens which readout.
		#LOC_SA_settings_scienceGate = Unlock readouts with science
		// Settings page: tooltip of the checkbox above.
		#LOC_SA_settings_scienceGate_tip = On (default): EXT TEMP, PRESSURE, live GRAVITY and WEATHER show "???" on a body until the matching experiment\n(thermometer, barometer, gravimeter, atmosphere analysis or orbital weather observation) has been credited there,\nin any situation and any biome. No effect in Sandbox.
		// Settings page: label of the weather-report checkbox (default off). Read by the SaWeatherReport companion DLL; on first activation it shows an English consent dialog in flight.
		#LOC_SA_settings_weatherReport = Enable weather report
		// Settings page: tooltip of the checkbox above. Manual line breaks every ~120 characters: the tooltip does not wrap on its own.
		#LOC_SA_settings_weatherReport_tip = Adds a small pencil button to the weather section. When SA's weather does not match what you see, press the matching\nlabel and one sample is written to a local file you can send to the author. Nothing is sent automatically.\nThe first time you turn this on, a disclaimer asks for your consent.
		// Settings page: label of the SA window/font scale slider (default 1.5 = +50%).
		#LOC_SA_settings_uiScale = SA panel scale
		// Settings page: tooltip of the slider above.
		#LOC_SA_settings_uiScale_tip = Scales the whole SA panel (window and font together, proportions unchanged), on top of the game's own UI Scale setting. Global value.
		// Settings page: label of the suborbital-altitude-threshold slider (default 0.25 = a quarter of the body's radius).
		#LOC_SA_settings_surfaceAltThreshold = Surface/suborbital altitude threshold
		// Settings page: tooltip of the slider above.
		#LOC_SA_settings_surfaceAltThreshold_tip = A suborbital trajectory below this fraction of the body's radius still reads as Surface mode, not Orbit. \nDoes not affect a real stable orbit at any altitude.

		// Header chip: panel mode badge, vessel on a normal solid/liquid surface.
		#LOC_SA_chip_surface = SURFACE
		// Header chip: panel mode badge, vessel in orbit/sub-orbital/escaping.
		#LOC_SA_chip_orbit = ORBIT
		// Header chip: panel mode badge, vessel on a body tidally locked onto its star.
		#LOC_SA_chip_tidalLock = TIDAL LOCK

		// Data row label: universal time (game calendar, Kronometer-aware).
		#LOC_SA_row_ut = UT
		// Data row label: local time at the KSC's real coordinates. Kept
		// short ("KSC" not "KSC TIME") because the timezone is appended
		// once at runtime, e.g. "KSC (TZ-3)" (bug fix 2026-07-25).
		#LOC_SA_row_kscTime = KSC
		// Data row label: mission elapsed time (optional, settings-gated).
		#LOC_SA_row_met = MET
		// Data row label: vessel latitude/longitude. Click cycles decimal/DMS format.
		#LOC_SA_row_coordinates = COORDINATES
		// Data row label: current science biome.
		#LOC_SA_row_biome = BIOME
		// Data row label: sun elevation/azimuth above the local horizon.
		#LOC_SA_row_sun = SUN
		// Data row label: solar flux at the vessel's position.
		#LOC_SA_row_flux = FLUX
		// Data row label: ambient external temperature (never the reentry-heated value). Click cycles °C/K. Hidden in vacuum (M3 restyling): a constant 4K there carries no information, see row_hullTemp.
		#LOC_SA_row_temperature = EXT TEMP
		// Data row label: thermal-mass-weighted average part temperature (M3 restyling) — always meaningful, unlike EXT TEMP which reads a fixed constant in a vacuum. Click cycles °C/K (same unit as EXT TEMP).
		#LOC_SA_row_hullTemp = HULL TEMP
		// Data row label: static atmospheric pressure. Click cycles kPa/atm (auto-switches to Pa under 1 kPa).
		#LOC_SA_row_pressure = PRESSURE
		// Data row label: local gravity (live sensed value by default, or fixed ASL — settings toggle). Click cycles g/m per s squared.
		#LOC_SA_row_gravity = GRAVITY
		// Data row label: distance/direction to the nearest terminator (tidal lock only). Click cycles km/deg.
		#LOC_SA_row_terminator = TERMINATOR
		// Former caption of the weather section, no longer shown (removed 2026-09-11). Kept commented out in case the caption returns; candidate for cleanup.
		// #LOC_SA_row_weather = WEATHER

		// Weather states, shown under the weather icon in the dial column.
		// Deliberately LOWERCASE, unlike the row labels above: this is a
		// description, not a field name. Keep them short — the column is narrow.
		// The one exception is weather_locked below, uppercase on purpose.
		// No cloud cover worth reporting.
		#LOC_SA_weather_clear = clear
		// Cloud cover overhead, no precipitation.
		#LOC_SA_weather_cloudy = cloudy
		// The vessel is inside a cloud/fog layer rather than under one.
		#LOC_SA_weather_fog = fog
		// Liquid precipitation falling at the vessel.
		#LOC_SA_weather_rain = rain
		// Frozen precipitation falling at the vessel.
		#LOC_SA_weather_snow = snow
		// Precipitation from a layer that also produces lightning.
		#LOC_SA_weather_thunderstorm = thunderstorm
		// Airborne dust/sand, on bodies with no surface liquid.
		#LOC_SA_weather_dustStorm = dust storm
		// Science gate: the weather has not been measured on this body yet (see settings_scienceGate).
		#LOC_SA_weather_locked = unknown

		// Per-body flavor names (see WeatherFlavor.cfg, SA_WEATHER_FLAVOR):
		// override the generic weather word above for a specific body/state,
		// never the classification itself.
		// Eve's Rain state: it is not water.
		#LOC_SA_flavor_eve_rain = Explodium Rain
		// Vall's Fog state, in the geyser plumes.
		#LOC_SA_flavor_vall_geyser = Geyser
		// Thunderstorm state inside a gas giant (Jool, Lindor, Sirona): electrified cloud deck, nothing falling.
		#LOC_SA_flavor_convective_storm = Convective storm

		// Forecast line under the weather state (phase A: from the cloud
		// layers' own on/off clocks, which are anchored to universal time).
		// Lowercase, 9px, two lines: the event, then the time — the \n is deliberate (user request 2026-09-11), keep it.
		// <<1>> = short state name (forecast_* below), <<2>> = time, e.g. "1h 20m".
		// The precipitation falling now stops NO LATER than <<2>> (its layers close).
		#LOC_SA_forecast_ends = <<1>> ends\nwithin <<2>>
		// A kind of weather nothing currently active can produce becomes possible in <<2>>. "risk": possible, not certain.
		#LOC_SA_forecast_risk = <<1>> risk\nin <<2>>
		// No precipitation window is open and none opens for at least <<1>> (the horizon, e.g. "3d"): nothing can fall for that long.
		#LOC_SA_forecast_stable = stable\nfor <<1>>+
		// One kind of weather (<<1>>) has its window open for another <<2>>: it MAY fall until then, not promised either way.
		#LOC_SA_forecast_possible = <<1>> possible\nfor <<2>>
		// A weather window is open with no end the clock can name (Kerbin): anything may happen. Three wordings of the same fact, rotated per weather window — keep them interchangeable in meaning.
		#LOC_SA_forecast_changeable_1 = changeable
		#LOC_SA_forecast_changeable_2 = unsettled
		#LOC_SA_forecast_changeable_3 = showers possible
		// Short state names for the sentences above — NOT the weather_* labels: these must fit next to a time on a 9px line.
		#LOC_SA_forecast_rain = rain
		#LOC_SA_forecast_snow = snow
		#LOC_SA_forecast_thunderstorm = thunderstorm
		#LOC_SA_forecast_dustStorm = dust storm

		// Footer: label before the solar day duration, e.g. "SOLAR DAY 24h 06m".
		#LOC_SA_footer_solarDay = SOLAR DAY

		// Clock sub-line: "local time" label next to the big clock (surface mode).
		#LOC_SA_val_localTime = LOCAL TIME
		// Clock sub-line: "Sol N" day counter (surface mode, non-home bodies only).
		#LOC_SA_val_sol = Sol
		// Clock sub-line: day-progress percentage label (surface mode).
		#LOC_SA_val_dayProgress = day
		// Dial sub-label, 3rd line, surface mode, when SOLAR TIME is toggled on and in Clock format: "LAT" (Local Apparent Time, the standard gnomonics term — the time a sundial at this exact spot would show). Retest 2026-07-30: label now cycles with the value, was a fixed "SOLAR" for both formats.
		#LOC_SA_val_solarTimePrefix = LAT
		// Same dial line, when cycled to the equation-of-time format instead — "EoT", paired with LAT (retest 2026-07-30).
		#LOC_SA_val_eqtPrefix = EoT
		// Next-event label: countdown to sunrise (surface mode).
		#LOC_SA_val_sunrise = sunrise
		// Next-event label: countdown to sunset (surface mode).
		#LOC_SA_val_sunset = sunset
		// Next-event label: countdown to eclipse entry (orbit mode).
		#LOC_SA_val_eclipse = ECLIPSE
		// Next-event label: countdown to return to light (orbit mode).
		#LOC_SA_val_light = LIGHT
		// Clock sub-line prefix, orbit mode: "NEXT ECLIPSE"/"NEXT LIGHT" (M3 restyling).
		#LOC_SA_val_next = NEXT
		// Clock sub-line, orbit mode, replaces "NEXT ECLIPSE/LIGHT" when orbiting a star itself (no eclipse geometry applies, retest 2026-07-27).
		#LOC_SA_val_starCentric = STAR-CENTRIC
		// Clock sub-line, orbit mode, replaces "NEXT ECLIPSE/LIGHT" on an escape trajectory: the timer counts down to leaving the current SoI instead (retest 2026-07-27).
		#LOC_SA_val_soiChange = SOI CHANGE
		// Clock sub-line, orbit mode: orbital period label, e.g. "Period 01:32:07" (M3 restyling).
		#LOC_SA_val_period = Period
		// Clock sub-line: sunlit fraction of the orbit (orbit mode).
		#LOC_SA_val_orbitLit = orbit lit
		// Lit-fraction value on a high orbit where the rounded percentage would misleadingly read "100%" despite a real (if brief-angle, possibly hours-long) eclipse existing (retest 2026-07-30).
		#LOC_SA_val_orbitLitNearFull = >99%
		// Strip tail prefix, orbit mode, lowercase on purpose (matches val_dayProgress's "day"): "light 71%" (M3 restyling).
		#LOC_SA_val_lightLower = light
		// Big clock text when the body is tidally locked on its star (replaces the local-time readout).
		#LOC_SA_val_tidalLock = TIDAL LOCK
		// Clock sub-line: explains why there's no local-time readout (tidal lock mode, and the stellar dive exception below).
		#LOC_SA_val_noLocalTime = NO LOCAL TIME
		// Clock main, Surface mode, when the body IS the star itself (retest 2026-07-28): danger-red alert label, replaces the local-time clock.
		#LOC_SA_val_stellarDive = STELLAR DIVE
		// Clock main, Surface mode, near a pole (M3 point 5, go 2026-07-28): neutral-color label, replaces the local-time clock — longitude is numerically unstable this close to the pole.
		#LOC_SA_val_polarZone = POLAR ZONE
		// Phase line under the dial, Surface mode, near a pole: with zero axial tilt the sun's elevation swing shrinks to almost nothing this close to the pole, so it never gets meaningfully dark.
		#LOC_SA_val_midnightSun = MIDNIGHT SUN
		// Clock sub-line: notes the sun's elevation is fixed (tidal lock mode).
		#LOC_SA_val_sunFixed = sun fixed
		// Clock sub-line, tidal lock mode: binary day/night indicator, replaces the 3-way phase name there (M3 restyling) — "day side".
		#LOC_SA_val_daySide = day side
		// Clock sub-line, tidal lock mode: binary day/night indicator — "night side".
		#LOC_SA_val_nightSide = night side
		// Strip tail prefix, tidal lock mode: "TERM 412 km E" (M3 restyling).
		#LOC_SA_val_termShort = TERM
		// Timeline tick label, tidal-lock bar: subsolar end.
		#LOC_SA_val_subsolar = subsolar
		// Timeline tick label, tidal-lock bar: antisolar end.
		#LOC_SA_val_antisolar = antisolar
		// Pressure row value when static pressure is zero (design doc §1.1 — more Kerbal than "0.00 kPa").
		#LOC_SA_val_vacuum = VACUUM
		// Solar-day footer value when the body is tidally locked on its star (no finite day length).
		#LOC_SA_val_infinite = infinite
		// Duration-formatter unit-letter symbols (retest 2026-07-28/29), fallback only — normally sourced live from stock's own #autoLOC_600231x keys (same word regardless of Kronometer, which only changes how many seconds a unit is).
		#LOC_SA_unit_year = y
		#LOC_SA_unit_day = d
		#LOC_SA_unit_hour = h
		#LOC_SA_unit_minute = m
		#LOC_SA_unit_second = s
		// Footer badge for any body tidally locked (on its star or its parent planet).
		#LOC_SA_val_locked = LOCKED
		// Gravity row value when the live sensor has no reading (beyond 3 body radii, same range limit as the stock gravity sensor part).
		#LOC_SA_val_outOfRange = OUT OF RANGE
		// Value of a science-gated row (EXT TEMP, PRESSURE) before the matching experiment has been credited on this body. "???" rather than the "—" used elsewhere: that dash means "no such value here", this means "there is one, you have not measured it".
		#LOC_SA_val_gated = ???

		// Surface day phase name: sun near the morning terminator (bodies WITH an atmosphere only — see terminatorSurface below for airless bodies).
		#LOC_SA_phase_dawn = Dawn
		// Surface day phase name: between dawn and noon.
		#LOC_SA_phase_morning = Morning
		// Surface day phase name: sun near its highest point in this timezone.
		#LOC_SA_phase_noon = Noon
		// Surface day phase name: between noon and dusk.
		#LOC_SA_phase_afternoon = Afternoon
		// Surface day phase name: sun near the evening terminator (bodies WITH an atmosphere only).
		#LOC_SA_phase_dusk = Dusk
		// Surface day phase name: sun below the horizon away from either terminator.
		#LOC_SA_phase_night = Night
		// Surface day phase name: replaces Dawn/Dusk on bodies WITHOUT an atmosphere (no optical twilight to tell them apart).
		#LOC_SA_phase_terminatorSurface = Terminator
		// Orbit phase name: vessel in direct sunlight.
		#LOC_SA_phase_sunlit = Sunlit
		// Orbit phase name: vessel in the body's shadow.
		#LOC_SA_phase_eclipse = Eclipse
		// Tidal-lock phase name: vessel on the permanent day side.
		#LOC_SA_phase_day = Day
		// Tidal-lock phase name: vessel near the static terminator band.
		#LOC_SA_phase_terminatorLock = Terminator
		// Tidal-lock phase name: vessel on the permanent night side.
		#LOC_SA_phase_nightLock = Night
	}
}
