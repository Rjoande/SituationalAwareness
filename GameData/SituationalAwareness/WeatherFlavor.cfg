// Situational Awareness — per-body weather names and icons.
//
// SA classifies weather from what EVE's cloud layers physically do, then names
// the result generically: RAIN, SNOW, THUNDERSTORM, DUST STORM. That is correct
// everywhere and evocative nowhere — what falls on Eve is not water, and saying
// "RAIN" there is technically true and narratively flat.
//
// An SA_WEATHER_FLAVOR node renames one (body, condition) pair, and optionally
// gives it its own icon. It is PRESENTATION ONLY: it never changes which state
// the classifier picked. That boundary is deliberate — if a config could
// reclassify, the panel would start asserting things the physics behind it does
// not support, and the label would quietly become a lie the day the classifier
// is retuned.
//
// Fields:
//   body        CelestialBody.bodyName — the INTERNAL id ("Eve", "Kerbin"), not
//               the display name, which is localized and freely renamed by packs.
//   condition   one of: Clear, Cloudy, Fog, Rain, Snow, Thunderstorm, DustStorm
//   name        shown instead of the generic name. A #LOC_ key is looked up; any
//               other string is shown verbatim.
//   icon        OPTIONAL GameDatabase texture path replacing the state icon,
//               used both day and night unless iconNight also applies.
//               White on transparent, like SA's own — it is tinted at runtime.
//   iconNight   OPTIONAL, used instead of icon (or the generic icon) only when
//               the sun is below the horizon at the vessel. Meant for Clear/
//               Cloudy, where the night sky itself is part of the picture —
//               how many moons a body sees depends entirely on which body it is.
//
// A pack can ship its own nodes for its own bodies without SA knowing anything
// about them, and ModuleManager can patch these like any other config.
// `name`, `icon` and `iconNight` are independent: an entry may set any subset.

// ---------------------------------------------------------------------------
// Named conditions — a state whose generic name undersells what is actually
// happening on that specific body.
// ---------------------------------------------------------------------------

SA_WEATHER_FLAVOR
{
	body = Eve
	condition = Rain
	name = #LOC_SA_flavor_eve_rain
	icon = SituationalAwareness/Textures/SA_weather_rain_acid
}

// Vall-Geysers. Renamed so a player standing in it
// reads "GEYSER" rather than the more generic "FOG".
SA_WEATHER_FLAVOR
{
	body = Vall
	condition = Fog
	name = #LOC_SA_flavor_vall_geyser
	icon = SituationalAwareness/Textures/SA_weather_fog_geyser
}

// Gas giants. Their Thunderstorm state comes from the classifier's
// dry-lightning rule: a deck of electrified cloud all around you with
// nothing falling out of it (Jool-Clouds/Underworld, Lindor-Clouds/
// Underworld, Sirona-Subsurface-Convection all carry a lightning config
// and no particle field). "THUNDERSTORM" suggests a passing squall;
// what surrounds you is the giant's own convection. Generic icon kept.
SA_WEATHER_FLAVOR
{
	body = Jool
	condition = Thunderstorm
	name = #LOC_SA_flavor_convective_storm
}

SA_WEATHER_FLAVOR
{
	body = Lindor
	condition = Thunderstorm
	name = #LOC_SA_flavor_convective_storm
}

SA_WEATHER_FLAVOR
{
	body = Sirona
	condition = Thunderstorm
	name = #LOC_SA_flavor_convective_storm
}

// ---------------------------------------------------------------------------
// Night-sky icon variants for Clear/Cloudy. The generic art (SA_weather_clear
// /_cloudy, "_night" suffix) now draws ONE moon — that is what most bodies
// with real weather actually see (Duna/Ike, Nodens/Belisama), so it needs no
// flavor entry at all. The three groups below cover everyone else.
// ---------------------------------------------------------------------------

// -- No moon worth drawing (negligible, or you are inside a gas giant's own
//    clouds and cannot see out anyway) ---------------------------------------

SA_WEATHER_FLAVOR
{
	body = Eve
	condition = Clear
	iconNight = SituationalAwareness/Textures/SA_weather_clear_night_bare
}

